version: '3.8'

services:
  # API Gateway
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - jarvis_net

  # Core Databases
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jarvis_admin
      POSTGRES_PASSWORD: jarvis_password
      POSTGRES_DB: jarvis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jarvis_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis_admin -d jarvis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: .
      dockerfile: ./services/auth_service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=dev-secret-key-do-not-use-in-prod
    networks:
      - jarvis_net
    depends_on:
      postgres:
        condition: service_healthy

  tunnel_relay:
    build:
      context: .
      dockerfile: ./services/tunnel_relay/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - JWT_SECRET=dev-secret-key-do-not-use-in-prod
    networks:
      - jarvis_net
    depends_on:
      - redis

  orchestrator:
    build:
      context: .
      dockerfile: ./services/orchestrator/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key}
      - TUNNEL_PUSH_URL=http://tunnel_relay:8001/api/v1/push
    networks:
      - jarvis_net
    depends_on:
      - tunnel_relay

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jarvis_net

networks:
  jarvis_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
